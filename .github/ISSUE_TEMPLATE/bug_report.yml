name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: afterglow-viz, Spotify, Spicetify and your OS.
    validations:
      required: true
