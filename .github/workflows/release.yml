name: release

# runs on a pushed v* tag, or from the Actions tab, where it tags the
# version in package.json
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Zip the app folder
        run: |
          mkdir -p out/afterglow-viz
          cp manifest.json dist/index.js out/afterglow-viz/
          cd out && zip -r ../afterglow-viz.zip afterglow-viz
      - name: Publish the release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p 'require("./package.json").version')"; fi
          gh release create "$TAG" afterglow-viz.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
