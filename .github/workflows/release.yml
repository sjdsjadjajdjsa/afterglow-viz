name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Zip the app folder
        run: |
          mkdir -p out/afterglow-viz
          cp manifest.json dist/index.js out/afterglow-viz/
          cd out && zip -r ../afterglow-viz.zip afterglow-viz
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" afterglow-viz.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
