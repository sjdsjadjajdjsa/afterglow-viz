<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>afterglow-viz harness</title>
    <style>
      :root {
        --spice-text: #ffffff;
        --spice-subtext: #b3b3b3;
        --spice-main: #121212;
        --spice-sidebar: #000000;
        --spice-card: #282828;
        --spice-button: #1ed760;
        --spice-notification-error: #e91429;
        --spice-rgb-text: 255, 255, 255;
      }
      html,
      body {
        margin: 0;
        background: var(--spice-main);
        color: var(--spice-text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app {
        min-height: 100vh;
        padding-bottom: 88px;
        box-sizing: border-box;
      }
      .harness {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        background: var(--spice-sidebar);
        border-top: 1px solid #333;
        font-size: 13px;
      }
      .harness button,
      .harness select {
        padding: 6px 12px;
        border: 1px solid #555;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .harness select {
        margin-left: 6px;
        background: #181818;
      }
      .harness .harness-play {
        min-width: 72px;
        border-color: transparent;
        background: var(--spice-text);
        color: #000;
        font-weight: 700;
      }
      .harness-track {
        display: flex;
        flex-direction: column;
        min-width: 140px;
      }
      .harness-track span,
      .harness-time,
      .harness label {
        color: var(--spice-subtext);
      }
      .harness input[type="range"] {
        flex: 1;
        min-width: 160px;
        accent-color: var(--spice-button);
      }
      .harness-time {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="harness"></div>
    <!-- harness first, it sets up window.Spicetify -->
    <script src="dist/dev-harness.js"></script>
    <script src="dist/index.js"></script>
  </body>
</html>
